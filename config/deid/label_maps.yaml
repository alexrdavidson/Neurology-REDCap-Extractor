# NER label → unified PHI category.
# Unified categories: PATIENT, STAFF, RELATIVE, AGE, DATE, PHONE, ID, EMAIL, URL, LOCATION,
# HOSPITAL, ORGANIZATION, OTHER.
unified: [PATIENT, STAFF, RELATIVE, AGE, DATE, PHONE, ID, EMAIL, URL, LOCATION, HOSPITAL, ORGANIZATION, OTHER]

obi:
  PATIENT: PATIENT
  STAFF: STAFF
  AGE: AGE
  DATE: DATE
  PHONE: PHONE
  ID: ID
  EMAIL: EMAIL
  PATORG: ORGANIZATION
  LOC: LOCATION
  HOSP: HOSPITAL
  OTHERPHI: OTHER
  # BIO/BIOES prefixes (B-, I-, L-, U-) are stripped before lookup.

stanford:
  PATIENT: PATIENT
  HCW: STAFF
  STAFF: STAFF
  AGE: AGE
  DATE: DATE
  PHONE: PHONE
  ID: ID
  IDNUM: ID
  EMAIL: EMAIL
  VENDOR: ORGANIZATION
  ORGANIZATION: ORGANIZATION
  LOCATION: LOCATION
  HOSPITAL: HOSPITAL
  OTHER: OTHER
  PROFESSION: OTHER
  URL: URL

# Surrogate token families per unified category.
surrogates:
  PATIENT: "[PATIENT]"
  RELATIVE: "[RELATIVE_{n:02d}]"
  STAFF: "[CLINICIAN_{n:02d}]"
  HOSPITAL: "[HOSPITAL_{n:02d}]"
  ORGANIZATION: "[ORGANIZATION_{n:02d}]"
  LOCATION: "[TOWN_{n:02d}]"
  ID: "[ID]"
  PHONE: "[PHONE]"
  EMAIL: "[EMAIL]"
  URL: "[URL]"
  AGE: "[AGE 90+]"
  OTHER: "[REDACTED]"
  DATE: null   # dates are shifted, not redacted
